# Default experiment configuration for BUDGET-MAPF.
# Phase 1 uses only the `env` block; later phases add model/train/comm blocks.

seed: 0

env:
  n_agents: 8
  fov: 9
  max_steps: 128
  map_pool_size: 128
  map_spec:
    kind: random        # random | room | maze | empty | file
    height: 20
    width: 20
    density: 0.15
  reward:
    step_penalty: -0.3
    stay_penalty: -0.5
    collision_penalty: -2.0
    goal_reward: 5.0
    leave_goal_penalty: -1.0
    team_bonus: 10.0

# Evaluation uses a held-out map pool via a distinct pool_seed.
eval:
  pool_seed: 999
  num_envs: 64
  episodes: 200
  curriculum:                       # (n_agents, size, density)
    - [4,  20, 0.10]
    - [8,  20, 0.15]
    - [8,  32, 0.20]
    - [16, 32, 0.20]
    - [32, 40, 0.20]
